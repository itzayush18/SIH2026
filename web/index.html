<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OILTRACE — Maritime Oil Spill Intelligence & Vessel Attribution</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --plane:#050a0f; --surface:#0e141b; --surface-2:#141c26; --surface-3:#1a2331;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#7c8996;
  --grid:#26313f; --rule:rgba(255,255,255,.10);
  --brand:#3987e5;
  --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70;
  --good:#0ca30c; --info:#3987e5; --warning:#fab219;
  --serious:#ec835a; --critical:#d03b3b;
  font-family: system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);height:100vh;overflow:hidden;
  display:grid;grid-template-rows:44px 1fr auto;
  grid-template-columns:340px 1fr 420px;
  grid-template-areas:
    "topbar topbar topbar"
    "left   map    right"
    "left   time   right";}
canvas{outline:none}

/* -------------------------------------------------------------- topbar --- */
#topbar{grid-area:topbar;background:var(--surface);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:16px;padding:0 14px;font-size:11.5px;color:var(--ink-2);
  z-index:1000}
.brand{font-size:13px;letter-spacing:.16em;font-weight:700;color:var(--ink);
  padding-right:12px;border-right:1px solid var(--rule);margin-right:2px}
.brand span{color:var(--brand)}
.simband{color:var(--warning);border:1px solid var(--warning);padding:2px 8px;border-radius:999px;
  font-size:10px;letter-spacing:.14em;font-weight:600}
.src{display:flex;gap:5px;align-items:center;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.src .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.src .dot.online{background:var(--good);box-shadow:0 0 6px var(--good)}
.src .dot.simulated{background:var(--warning);box-shadow:0 0 6px var(--warning)}
.src .dot.offline{background:var(--critical)}
.src .dot.cached{background:var(--info)}
.spacer{flex:1}
#topbar .stat{padding:0 10px;border-left:1px solid var(--rule);white-space:nowrap}
#sources{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#topbar .stat b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
#topbar button{background:transparent;color:var(--ink-2);border:1px solid var(--rule);
  padding:5px 10px;font-size:11.5px;border-radius:6px;cursor:pointer;font-family:inherit}
#topbar button:hover{color:var(--ink);border-color:rgba(255,255,255,.28)}
#topbar button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}

/* --------------------------------------------------------------- left ---- */
#left{grid-area:left;background:var(--surface);border-right:1px solid var(--rule);
  overflow-y:auto;display:flex;flex-direction:column}
#leftHead{padding:12px 14px 8px;border-bottom:1px solid var(--rule)}
#leftHead h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  margin:0 0 4px;font-weight:600}
#scenario{width:100%;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--rule);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;
  margin-bottom:6px}
#runOne{width:100%;background:var(--brand);color:#fff;border:0;
  padding:8px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
#runOne:hover{filter:brightness(1.1)}
#runOne.busy{background:var(--surface-2);color:var(--muted);cursor:progress}
#runAll{width:100%;background:transparent;color:var(--ink-2);border:1px solid var(--rule);
  padding:6px;margin-top:6px;border-radius:6px;font-size:11.5px;cursor:pointer;font-family:inherit}
#runAll:hover{color:var(--ink)}
#stagebar{margin-top:8px;height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden}
#stagebar span{display:block;width:0%;height:100%;background:var(--brand);
  transition:width .4s ease}
#stagetext{margin-top:4px;font-size:10.5px;color:var(--muted);min-height:14px;letter-spacing:.05em}

#incidents{padding:6px 8px}
.iCard{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;
  padding:9px 11px;margin-bottom:6px;cursor:pointer;transition:border-color .15s,transform .15s}
.iCard:hover{border-color:rgba(255,255,255,.25);transform:translateY(-1px)}
.iCard.active{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.iCard .rowa{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.iCard .iid{font-weight:600;color:var(--ink)}
.iCard .rowb{font-size:12.5px;color:var(--ink);margin-top:2px;font-weight:600;line-height:1.25}
.iCard .rowc{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.iCard .badge{font-size:9.5px;letter-spacing:.08em;padding:1px 6px;border-radius:999px;
  border:1px solid currentColor}
.sev-CRITICAL{color:var(--critical)}
.sev-HIGH{color:var(--serious)}
.sev-MEDIUM{color:var(--warning)}
.sev-LOW{color:var(--info)}
.sev-INFO{color:var(--muted)}
#empty{padding:14px;color:var(--muted);font-size:11.5px;line-height:1.6;text-align:center}

/* --------------------------------------------------------------- map ---- */
#map{grid-area:map;background:#04070c;position:relative}
#readout{position:absolute;left:10px;bottom:8px;font-size:10.5px;color:var(--ink-2);
  background:rgba(16,22,30,.85);border:1px solid var(--rule);border-radius:6px;
  padding:3px 8px;font-variant-numeric:tabular-nums;z-index:600}
#maptools{position:absolute;top:10px;right:10px;z-index:600;display:flex;gap:6px;
  background:rgba(16,22,30,.9);border:1px solid var(--rule);border-radius:8px;padding:6px}
#maptools select,#maptools button{background:transparent;color:var(--ink-2);border:1px solid var(--rule);
  padding:4px 8px;font-size:11px;border-radius:5px;cursor:pointer;font-family:inherit}
#maptools button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.maplibregl-ctrl-attrib{background:rgba(16,22,30,.85)!important;color:var(--muted)!important}
.maplibregl-ctrl-attrib a{color:var(--muted)!important}
.maplibregl-popup-content{background:var(--surface-2)!important;color:var(--ink)!important;
  border:1px solid var(--rule);border-radius:8px;font-size:11.5px;padding:8px 10px;
  box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:280px}
.maplibregl-popup-tip{border-top-color:var(--surface-2)!important;border-bottom-color:var(--surface-2)!important}
.maplibregl-ctrl-group{background:rgba(16,22,30,.9)!important;border:1px solid var(--rule)!important}
.maplibregl-ctrl-group button span{filter:invert(1) contrast(.85) brightness(1.4)}
.maplibregl-ctrl-scale{background:rgba(16,22,30,.85)!important;color:var(--ink-2)!important;
  border-color:var(--rule)!important}

/* ------------------------------------------------------------ timeline --- */
#time{grid-area:time;background:var(--surface);border-top:1px solid var(--rule);
  padding:10px 14px 8px;position:relative;z-index:500}
.trow{display:flex;align-items:center;gap:12px}
#play{width:36px;height:36px;flex:none;border-radius:9px;cursor:pointer;
  border:1px solid var(--rule);background:var(--brand);color:#fff;font-size:14px;line-height:1;
  box-shadow:0 0 18px rgba(57,135,229,.3)}
#play.playing{background:var(--surface-2);color:var(--ink);box-shadow:none}
#tl{flex:1;height:4px;accent-color:var(--brand)}
#clock{font-variant-numeric:tabular-nums;font-size:16px;min-width:150px;text-align:right}
#clock small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.06em}
.ticks{position:relative;height:22px;margin:4px 50px 0 50px;font-size:10px;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.ticks .now{color:var(--ink);font-weight:600}

/* -------------------------------------------------------------- right --- */
#right{grid-area:right;background:var(--surface);border-left:1px solid var(--rule);
  overflow-y:auto;padding:12px 14px 24px}
#right .tabs{display:flex;gap:2px;margin-bottom:10px;border-bottom:1px solid var(--rule)}
#right .tabs button{flex:1;background:transparent;color:var(--muted);border:0;
  padding:8px 6px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;cursor:pointer;
  border-bottom:2px solid transparent;font-family:inherit;font-weight:600}
#right .tabs button.on{color:var(--ink);border-bottom-color:var(--brand)}
.tabc{display:none}
.tabc.on{display:block}
h2{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  margin:12px 0 8px;font-weight:600}
.card{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;
  padding:11px 12px;margin-bottom:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tile{background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:9px 11px}
.tile .v{font-size:19px;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .u{font-size:10.5px;color:var(--muted)}
.tile .k{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--ink-2);
  padding:3px 0;border-bottom:1px solid var(--grid)}
.kv b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.suspect{cursor:pointer;transition:border-color .15s}
.suspect:hover{border-color:rgba(255,255,255,.25)}
.suspect.active{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.srow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.nm{font-size:13px;font-weight:600}
.mm{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.score{font-size:22px;font-variant-numeric:tabular-nums;line-height:1}
.badge{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.bar{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;
  gap:8px;margin-top:5px;font-size:10.5px;color:var(--ink-2)}
.track{display:block;height:6px;background:var(--grid);border-radius:3px;overflow:hidden}
.fill{display:block;height:100%;border-radius:0 3px 3px 0;background:var(--brand);
  transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
ul.ev{margin:8px 0 0;padding-left:16px;font-size:11px;color:var(--ink-2);line-height:1.55}
ul.ev li{margin-bottom:2px}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:10.5px;color:var(--ink-2);margin-bottom:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
label.lyr{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2);margin:5px 0}
label.lyr input[type=range]{margin-left:auto;width:80px;accent-color:var(--brand)}

.alert{background:var(--surface-2);border-left:3px solid var(--muted);border-radius:6px;
  padding:8px 11px;margin-bottom:6px;font-size:11.5px;color:var(--ink)}
.alert.al-CRITICAL{border-left-color:var(--critical)}
.alert.al-HIGH{border-left-color:var(--serious)}
.alert.al-MEDIUM{border-left-color:var(--warning)}
.alert.al-LOW{border-left-color:var(--info)}
.alert .t{font-size:9.5px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;font-weight:600}
.alert .m{margin-top:3px;color:var(--ink-2);font-size:11px;line-height:1.5}

.patrol{background:var(--surface-2);border:1px solid var(--rule);border-radius:6px;
  padding:9px 11px;margin-bottom:6px}
.patrol .p1{color:var(--critical)}.patrol .p2{color:var(--serious)}.patrol .p3{color:var(--info)}
.patrol .hd{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.patrol .tg{font-size:12.5px;color:var(--ink);font-weight:600;margin:3px 0}
.patrol .rs{font-size:11px;color:var(--ink-2);line-height:1.5}

details summary{font-size:11px;color:var(--muted);cursor:pointer;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:10.5px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:4px 5px;border-bottom:1px solid var(--grid)}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}

#downloadBtns a{display:inline-block;background:var(--surface-2);color:var(--ink-2);
  border:1px solid var(--rule);border-radius:5px;padding:5px 10px;font-size:11px;
  text-decoration:none;margin:3px 4px 0 0}
#downloadBtns a:hover{color:var(--ink);border-color:var(--brand)}
</style>
</head>
<body>

<div id="topbar">
  <div class="brand">OIL<span>TRACE</span></div>
  <div class="simband" id="modeBadge">SIMULATION</div>
  <div class="spacer"></div>
  <div id="sources"></div>
  <div class="stat">INCIDENTS <b id="stI">0</b></div>
  <div class="stat">HIGH RISK <b id="stH">0</b></div>
  <div class="stat">CANDIDATES <b id="stC">0</b></div>
</div>

<div id="left">
  <div id="leftHead">
    <h2>New scenario</h2>
    <select id="scenario"></select>
    <button id="runOne">▶ Run pipeline</button>
    <button id="runAll">▶▶ Run every scenario</button>
    <div id="stagebar"><span></span></div>
    <div id="stagetext">idle</div>
    <h2 style="margin-top:14px">Active incidents</h2>
  </div>
  <div id="incidents"><div id="empty">No incidents yet — pick a scenario and run the pipeline.</div></div>
</div>

<div id="map">
  <div id="readout">move the cursor over the map</div>
  <div id="maptools">
    <select id="basemap">
      <option value="esri-imagery">Esri satellite</option>
      <option value="esri-ocean">Ocean bathymetry</option>
      <option value="carto-dark">Carto dark</option>
      <option value="osm">OpenStreetMap</option>
    </select>
    <button id="btn3d">3D</button>
    <button id="btnFrame">Frame slick</button>
  </div>
</div>

<div id="time">
  <div class="trow">
    <button id="play">▶</button>
    <input type="range" id="tl" min="-24" max="18" step="0.25" value="0">
    <div id="clock">—<small>ACQUISITION</small></div>
  </div>

</div>

<aside id="right">
  <div class="tabs">
    <button data-tab="overview" class="on">Overview</button>
    <button data-tab="suspects">Suspects</button>
    <button data-tab="alerts">Alerts</button>
    <button data-tab="patrol">Patrol</button>
    <button data-tab="timeline">Timeline</button>
    <button data-tab="evidence">Evidence</button>
  </div>
  <div id="tab-overview" class="tabc on"><div id="empty2" style="padding:14px;color:var(--muted);font-size:12px">Select an incident on the left.</div></div>
  <div id="tab-suspects" class="tabc"></div>
  <div id="tab-alerts"   class="tabc"></div>
  <div id="tab-patrol"   class="tabc"></div>
  <div id="tab-timeline" class="tabc"></div>
  <div id="tab-evidence" class="tabc"></div>
</aside>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
// ---- static-mode shim -------------------------------------------------
// GitHub Pages can only serve static files. If /api/... returns 404 we
// rewrite the URL to a matching JSON snapshot under ./api/... .json produced
// by scripts/build_site.py. The main app doesn't know or care which mode it
// is in.
const _origFetch = window.fetch;
let _staticMode = null;   // null=unknown, true/false once probed
async function _isStatic(){
  if(_staticMode !== null) return _staticMode;
  try{
    const r = await _origFetch('./api/STATIC.json', {cache:'no-store'});
    _staticMode = r.ok;
  }catch(e){ _staticMode = false; }
  return _staticMode;
}
function _staticize(url){
  // /api/foo?bar        -> ./api/foo.json
  // /api/incidents/X/y  -> ./api/incidents/X/y.json
  // /api/*.geojson kept as-is
  if(!url.startsWith('/api/')) return url;
  if(url.endsWith('.geojson')) return '.' + url;
  const [path] = url.split('?');
  if(path.endsWith('.pdf')) return '.' + path;
  return '.' + path + '.json';
}
window.fetch = async function(url, opts){
  if(typeof url === 'string' && url.startsWith('/api/')){
    if(await _isStatic()) return _origFetch(_staticize(url), opts);
  }
  return _origFetch(url, opts);
};
// Static mode also disables Run pipeline / Notify.
document.addEventListener('DOMContentLoaded', async ()=>{
  if(await _isStatic()){
    document.title = document.title + ' — static snapshot';
    setTimeout(()=>{
      const badge = document.getElementById('modeBadge');
      if(badge){ badge.textContent = 'STATIC SNAPSHOT'; }
      ['runOne','runAll'].forEach(id=>{
        const b=document.getElementById(id);
        if(b){ b.disabled=true; b.title='live pipeline disabled on the static snapshot — clone the repo to run it'; b.style.opacity=.5; b.style.cursor='not-allowed'; }
      });
    },200);
  }
});

const fmt=(n,d=1)=>Number(n).toFixed(d);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
function risk(s){
  if(s>=.75) return {label:'PRIME SUSPECT',      c:'var(--critical)', hex:'#d03b3b'};
  if(s>=.45) return {label:'PERSON OF INTEREST', c:'var(--serious)',  hex:'#ec835a'};
  if(s>=.20) return {label:'TO ELIMINATE',       c:'var(--warning)',  hex:'#fab219'};
  return       {label:'CLEARED',                 c:'var(--good)',     hex:'#0ca30c'};
}
const TERMS=[['source_match','Source track'],['spatiotemporal','Origin envelope'],
             ['behaviour','Behaviour'],['dark','AIS gap'],
             ['alignment','Axis align'],['prior','Vessel prior']];
const STAGES=['ingest','detect','characterize','drift','invert','attribute'];

const BASEMAPS={
  'esri-imagery':{tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                  attribution:'Imagery &copy; Esri, Maxar', maxzoom:19},
  'esri-ocean':{tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}'],
                attribution:'Ocean &copy; Esri, GEBCO', maxzoom:13},
  'carto-dark':{tiles:['https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
                       'https://b.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'],
                attribution:'&copy; OSM &copy; CARTO', maxzoom:19},
  'osm':{tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
         attribution:'&copy; OSM contributors', maxzoom:19},
};
function styleFor(name){
  const b=BASEMAPS[name];
  return {version:8,
    sources:{base:{type:'raster',tiles:b.tiles,tileSize:256,attribution:b.attribution,maxzoom:b.maxzoom}},
    layers:[{id:'bg',type:'background',paint:{'background-color':'#04070c'}},
            {id:'base',type:'raster',source:'base',paint:{'raster-opacity':.9}}]};
}

let map, R=null, T=0, playing=false, lastFrame=0, epochMs=0;
let activeIncident=null, originSlices=[], activeSliceIdx=-1;

/* -------------------------------------------------------------- boot ---- */
async function boot(){
  await loadStatus();
  await loadScenarios();
  await loadIncidents();
  buildMap();
  buildTransport();
  await new Promise(res=>map.once('load',res));
  await ensureBaseLayers();
  await loadJurisdictions();
  wireTabs();
  wireTools();
  // ?open=OIL-2026-... auto-opens a named incident on load (screenshot support).
  const m=new URLSearchParams(location.search).get('open');
  if(m){
    const c=document.querySelector(`.iCard[data-id="${m}"]`);
    if(c) c.click();
  } else {
    const first=document.querySelector('.iCard'); if(first) first.click();
  }
  setInterval(loadStatus, 10000);
}
async function loadStatus(){
  const s = await (await fetch('/api/system/status')).json();
  const box=document.getElementById('sources'); box.innerHTML='';
  s.sources.forEach(sr=>{
    box.append(el(`<div class="src" title="${sr.name} · ${sr.tier} · ${sr.status}"><span class="dot ${sr.status.toLowerCase()}"></span><span style="font-size:10.5px">${sr.category.toUpperCase()}</span></div>`));
  });
  document.getElementById('modeBadge').textContent = 'SIMULATION';
}
async function loadScenarios(){
  const r = await (await fetch('/api/scenarios')).json();
  const sel = document.getElementById('scenario'); sel.innerHTML='';
  r.scenarios.forEach(s=>{
    const o=document.createElement('option');
    o.value=s.slug; o.textContent=`${s.name}  (${s.difficulty})`;
    sel.append(o);
  });
}
async function loadIncidents(){
  const r = await (await fetch('/api/incidents')).json();
  const box = document.getElementById('incidents');
  box.innerHTML='';
  if(!r.incidents.length){
    box.append(el(`<div id="empty">No incidents yet — pick a scenario and run the pipeline.</div>`));
    document.getElementById('stI').textContent='0';
    document.getElementById('stH').textContent='0';
    document.getElementById('stC').textContent='0';
    return;
  }
  document.getElementById('stI').textContent=r.incidents.length;
  document.getElementById('stH').textContent=r.incidents.filter(i=>i.severity==='CRITICAL'||i.severity==='HIGH').length;
  document.getElementById('stC').textContent=r.incidents.reduce((a,i)=>a+(i.prime_suspect?1:0),0);

function bboxFromCorners(bounds){const [[s,w],[n,e]]=bounds;return [[w,n],[e,n],[e,s],[w,s]];}
function ringPoly(ring){
  const r=ring.slice();
  if(r.length && (r[0][0]!==r[r.length-1][0]||r[0][1]!==r[r.length-1][1])) r.push(r[0]);
  return {type:'Feature',geometry:{type:'Polygon',coordinates:[r]},properties:{}};
}
function emptyFC(){return {type:'FeatureCollection',features:[]};}

function installIncidentLayers(rep){
  // Remove previous incident overlays first — sources get reused per incident.
  ['sar','slick','originAll','originSlice','slick-ring','ais','source','source-start',
   'past','future','vessels','hi-track','hi-gap'].forEach(id=>{
    const s=map.getSource(id); if(!s) return;
    map.getStyle().layers.filter(L=>L.source===id).forEach(L=>map.removeLayer(L.id));
    map.removeSource(id);
  });

  const iid=rep.oiltrace.incident_id;
  const prefix=`./incidents/${iid}/`;
  map.addSource('sar',{type:'image',url:prefix+'sar.png',coordinates:bboxFromCorners(rep.scene.bounds)});
  map.addSource('slick',{type:'image',url:prefix+'slick.png',coordinates:bboxFromCorners(rep.scene.bounds)});
  map.addSource('originAll',{type:'image',url:prefix+rep.origin_pdf.png,coordinates:bboxFromCorners(rep.origin_pdf.bounds)});
  originSlices=(rep.origin_pdf.slices||[]).map(s=>prefix+s.png); activeSliceIdx=-1;
  // Warm the browser cache so scrubbing the timeline swaps instantly.
  originSlices.forEach(u=>{const im=new Image(); im.src=u;});
  map.addSource('originSlice',{type:'image',url:originSlices[0]||prefix+'origin.png',coordinates:bboxFromCorners(rep.origin_pdf.bounds)});

  map.addLayer({id:'sar-l',type:'raster',source:'sar',paint:{'raster-opacity':.8}});
  map.addLayer({id:'originAll-l',type:'raster',source:'originAll',paint:{'raster-opacity':.32}});
  map.addLayer({id:'originSlice-l',type:'raster',source:'originSlice',paint:{'raster-opacity':.62,'raster-fade-duration':400}});
  map.addLayer({id:'slick-l',type:'raster',source:'slick',paint:{'raster-opacity':.85}});

  const ring=(rep.detections[0].contour_lonlat||[]);
  if(ring.length){
    map.addSource('slick-ring',{type:'geojson',data:ringPoly(ring)});
    map.addLayer({id:'slick-fill',type:'fill',source:'slick-ring',
      paint:{'fill-color':'#d95926','fill-opacity':.08}});
    map.addLayer({id:'slick-halo',type:'line',source:'slick-ring',
      paint:{'line-color':'#000','line-width':7,'line-opacity':.55,'line-blur':3}});
    map.addLayer({id:'slick-outline',type:'line',source:'slick-ring',
      paint:{'line-color':'#d95926','line-width':2.5}});
  }

  map.addSource('ais',{type:'geojson',data:{type:'FeatureCollection',
    features:rep.vessels.map(v=>({type:'Feature',
      properties:{mmsi:v.mmsi,name:v.name,type:v.type},
      geometry:{type:'LineString',coordinates:v.track.map(p=>[p[0],p[1]])}}))}});
  map.addLayer({id:'ais-l',type:'line',source:'ais',
    paint:{'line-color':'#3987e5','line-width':1.2,'line-opacity':.32}});

  const st = rep.source.track.map(p=>[p.lon,p.lat]);
  map.addSource('source',{type:'geojson',data:{type:'Feature',properties:{},
    geometry:{type:'LineString',coordinates:st}}});
  map.addLayer({id:'source-halo',type:'line',source:'source',
    paint:{'line-color':'#000','line-width':7,'line-opacity':.55,'line-blur':2}});
  map.addLayer({id:'source-l',type:'line',source:'source',
    paint:{'line-color':'#199e70','line-width':3,'line-dasharray':[2,1.5]}});
  map.addSource('source-start',{type:'geojson',data:{type:'Feature',
    properties:{label:`Release start · ${fmt(rep.source.t_start/3600,1)} h before acquisition`},
    geometry:{type:'Point',coordinates:st[0]}}});
  map.addLayer({id:'source-start-l',type:'circle',source:'source-start',
    paint:{'circle-radius':7,'circle-color':'#199e70','circle-stroke-width':2,'circle-stroke-color':'#052015'}});

  map.addSource('past',{type:'geojson',data:emptyFC()});
  map.addSource('future',{type:'geojson',data:emptyFC()});
  map.addLayer({id:'past-l',type:'circle',source:'past',
    paint:{'circle-radius':['interpolate',['linear'],['zoom'],7,1.4,12,2.8],
      'circle-color':'#d95926','circle-opacity':.55,'circle-blur':.3}});
  map.addLayer({id:'future-l',type:'circle',source:'future',
    paint:{'circle-radius':['interpolate',['linear'],['zoom'],7,1.4,12,2.8],
      'circle-color':'#3987e5','circle-opacity':.55,'circle-blur':.3}});

  map.addSource('vessels',{type:'geojson',data:emptyFC()});
  map.addLayer({id:'vessel-shadow',type:'circle',source:'vessels',
    paint:{'circle-radius':10,'circle-color':'#000','circle-opacity':.55,'circle-blur':.6}});
  map.addLayer({id:'vessel-body',type:'circle',source:'vessels',
    paint:{'circle-radius':['interpolate',['linear'],['zoom'],7,4,12,7],
      'circle-color':['get','color'],
      'circle-stroke-width':1.4,'circle-stroke-color':'#0d0d0d',
      'circle-opacity':['get','opacity']}});

  // Patrol tasks as circles on the base overlay.
  map.getSource('patrol').setData({type:'FeatureCollection',
    features:(rep.oiltrace.patrol||[]).map(t=>circleGeoJSON(t))});

  // Popups
  const popup=new maplibregl.Popup({closeButton:false,closeOnClick:false,offset:12});
  const enter=e=>{map.getCanvas().style.cursor='pointer';
    const f=e.features[0], p=f.properties||{};
    popup.setLngLat(e.lngLat).setHTML(
      p.mmsi?`<b>${p.name}</b><br>MMSI ${p.mmsi} · ${p.type||''}`:
      p.name?`<b>${p.name}</b>`:p.label||'').addTo(map);};
  const leave=()=>{map.getCanvas().style.cursor='';popup.remove();};
  ['ais-l','vessel-body','source-l','source-start-l','slick-outline','jur-fill'].forEach(id=>{
    if(!map.getLayer(id)) return;
    map.on('mouseenter',id,enter); map.on('mouseleave',id,leave);
  });
}
function circleGeoJSON(t){
  const n=48, out=[]; const R=6371;
  const lat=t.lat*Math.PI/180, lon=t.lon*Math.PI/180;
  for(let i=0;i<=n;i++){
    const th=2*Math.PI*i/n, r=t.radius_km/R;
    const la=Math.asin(Math.sin(lat)*Math.cos(r)+Math.cos(lat)*Math.sin(r)*Math.cos(th));
    const lo=lon+Math.atan2(Math.sin(th)*Math.sin(r)*Math.cos(lat),Math.cos(r)-Math.sin(lat)*Math.sin(la));
    out.push([lo*180/Math.PI, la*180/Math.PI]);
  }
  return {type:'Feature',
    properties:{priority:t.priority,name:t.action+': '+t.target},
    geometry:{type:'Polygon',coordinates:[out]}};
}

/* --------------------------------------------------- drift animation ---- */
function drawParticles(t){
  if(!R||!map.getSource('past')) return;
  const set = t<=0 ? R.hindcast : R.forecast;
  let a=set[0], b=set[0], best=1e9, best2=1e9;
  for(const s of set){
    const d=Math.abs(s.t_rel_h-t);
    if(d<best){best2=best;b=a;best=d;a=s;} else if(d<best2){best2=d;b=s;}
  }
  const span=(a.t_rel_h-b.t_rel_h)||1, f=Math.max(0,Math.min(1,(t-b.t_rel_h)/span));
  const n=Math.min(a.points.length,b.points.length);
  const feats=new Array(n);
  for(let i=0;i<n;i++){
    const p=a.points[i], q=b.points[i];
    feats[i]={type:'Feature',properties:{},
      geometry:{type:'Point',coordinates:[q[0]+(p[0]-q[0])*f, q[1]+(p[1]-q[1])*f]}};
  }
  const src = t<=0?map.getSource('past'):map.getSource('future');
  const other = t<=0?map.getSource('future'):map.getSource('past');
  src.setData({type:'FeatureCollection',features:feats});
  other.setData(emptyFC());
}
function posAt(track,t){
  if(!track.length||t<track[0][2]||t>track[track.length-1][2]) return null;
  for(let i=1;i<track.length;i++){
    const a=track[i-1], b=track[i];
    if(t>=a[2]&&t<=b[2]){
      const s=(b[2]-a[2])||1, f=(t-a[2])/s;
      return {lat:a[1]+f*(b[1]-a[1]),lon:a[0]+f*(b[0]-a[0]),
              cog:Math.atan2(b[0]-a[0],b[1]-a[1])*180/Math.PI};
    }
  }
  return null;
}
function drawVessels(t){
  if(!R||!map.getSource('vessels')) return;
  const rank=new Map(R.suspects.map(s=>[s.mmsi,s]));
  const feats=[];
  for(const v of R.vessels){
    const p=posAt(v.track,t*3600); if(!p) continue;
    const s=rank.get(v.mmsi);
    const dark=(v.gaps||[]).some(g=>t*3600>=g[0]&&t*3600<=g[1]);
    const hex=s?risk(s.score).hex:'#3987e5';
    feats.push({type:'Feature',
      properties:{mmsi:v.mmsi,name:v.name,type:v.type,
        color:dark?'#898781':hex,opacity:dark?.55:1},
      geometry:{type:'Point',coordinates:[p.lon,p.lat]}});
  }
  map.getSource('vessels').setData({type:'FeatureCollection',features:feats});
}
function swapOriginSlice(t){
  if(!R||!map.getSource('originSlice')) return;
  let want=-1;
  if(t<0&&R.origin_pdf.slices){
    R.origin_pdf.slices.forEach((s,i)=>{
      if(t<=s.t_from_h+1e-6 && t>=s.t_to_h-1e-6) want=i;
    });
  }
  if(want!==activeSliceIdx){
    activeSliceIdx=want;
    map.getSource('originSlice').updateImage({
      url: want>=0?originSlices[want]:('/incidents/'+R.oiltrace.incident_id+'/origin.png'),
      coordinates:bboxFromCorners(R.origin_pdf.bounds)});
    map.setPaintProperty('originSlice-l','raster-opacity', want>=0?.62:0);
  }
}
function setTime(t){
  T=t;
  const sl=document.getElementById('tl'); if(+sl.value!==t) sl.value=t;
  drawParticles(t); drawVessels(t); swapOriginSlice(t); refreshVectors();
  if(!R) return;
  const d=new Date(epochMs+t*3600e3);
  const hh=String(d.getUTCHours()).padStart(2,'0'), mm=String(d.getUTCMinutes()).padStart(2,'0');
  document.getElementById('clock').innerHTML=
    `${hh}:${mm}<small>${d.toISOString().slice(0,10)} UTC · ${t<0?fmt(t,1):'+'+fmt(t,1)} h</small>`;
}
function buildTransport(){
  document.getElementById('play').addEventListener('click',()=>playing?stop():start());
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
    const sl=document.getElementById('tl');
    if(e.code==='Space'){e.preventDefault();playing?stop():start();}
    if(e.code==='ArrowLeft'){stop();setTime(Math.max(+sl.min,T-.5));}
    if(e.code==='ArrowRight'){stop();setTime(Math.min(+sl.max,T+.5));}
  });
  document.getElementById('tl').addEventListener('input',e=>{stop();setTime(+e.target.value);});
}
function renderTicks(tmin,tmax,src){
  const ticks=document.getElementById('ticks'); ticks.innerHTML='';
  for(let h=Math.ceil(tmin);h<=tmax;h+=6){
    const pct=(h-tmin)/(tmax-tmin)*100;
    ticks.append(el(`<span style="left:${pct}%" class="${h===0?'now':''}">${
      h===0?'ACQ':(h<0?h+'h':'+'+h+'h')}</span>`));
  }
  if(src){
    const rs=src.t_start/3600, re=(src.t_start+src.duration)/3600;
    const pc=x=>(x-tmin)/(tmax-tmin)*100;
    ticks.append(el(`<span style="left:${pc(rs)}%;top:11px;color:#199e70;
      border-left:2px solid #199e70;padding-left:4px;transform:none">release ${
      fmt(rs,1)}→${fmt(re,1)} h</span>`));
  }
}
function start(){playing=true;lastFrame=performance.now();
  const b=document.getElementById('play');b.textContent='❚❚';b.classList.add('playing');
  const sl=document.getElementById('tl');
  if(T>=+sl.max-.01) setTime(+sl.min);
  requestAnimationFrame(step);}
function stop(){playing=false;
  const b=document.getElementById('play');b.textContent='▶';b.classList.remove('playing');}
function step(now){
  if(!playing) return;
  const sl=document.getElementById('tl');
  const dt=(now-lastFrame)/1000; lastFrame=now;
  let t=T+dt*4.5;
  if(t>=+sl.max){setTime(+sl.max);stop();return;}
  setTime(t);
  requestAnimationFrame(step);
}

/* ---------------------------------------------------- open incident ----- */
async function openIncident(iid){
  activeIncident=iid;
  document.querySelectorAll('.iCard').forEach(c=>c.classList.toggle('active',c.dataset.id===iid));
  const j = await (await fetch('/api/incidents/'+iid)).json();
  R = j.report;
  epochMs = Date.parse(R.generated_for+'Z');
  installIncidentLayers(R);
  const tmin=Math.floor(Math.min(...R.hindcast.map(s=>s.t_rel_h)));
  const tmax=Math.ceil(Math.max(...R.forecast.map(s=>s.t_rel_h)));
  const sl=document.getElementById('tl'); sl.min=tmin; sl.max=tmax;
  renderTicks(tmin,tmax,R.source);
  setTime(Math.max(tmin, R.source.t_start/3600));
  frameSlick();
  renderRightPanel(R);
}
function frameSlick(){
  if(!R) return;
  const b=R.scene.bounds;
  map.fitBounds([[b[0][1],b[0][0]],[b[1][1],b[1][0]]],

      <div class="kv"><span>Release start</span><b>${fmt(rep.source.t_start/3600,1)} h before acq</b></div>
      <div class="kv"><span>Duration</span><b>${fmt(rep.source.duration/3600,1)} h</b></div>
      <div class="kv"><span>Course / speed</span><b>${fmt(rep.source.course_deg,0)}° · ${fmt(rep.source.speed_kn,1)} kn</b></div>
      <div class="kv"><span>Start position</span><b>${fmt(rep.source.start_lat,3)}, ${fmt(rep.source.start_lon,3)}</b></div>
      <div class="kv"><span>Inversion IoU</span><b>${fmt(rep.source.iou,3)}</b></div>
      <div class="kv"><span title="dispersion of near-optimal solutions">Search dispersion</span><b>${fmt(rep.source.search_dispersion.position_sd_km,1)} km · ${fmt(rep.source.search_dispersion.t_start_sd_h,1)} h</b></div>
    </div>
    ${(v&&Number.isFinite(v?.segmentation?.iou))?`
    <h2>Validation vs known truth</h2>
    <div class="card">
      <div class="kv"><span>Segmentation IoU / F1</span><b>${fmt(v.segmentation.iou,3)} / ${fmt(v.segmentation.f1,3)}</b></div>
      <div class="kv"><span>Origin position error</span><b>${fmt(v.inversion_error_km,2)} km</b></div>
      <div class="kv"><span>Release time error</span><b>${fmt(v.inversion_time_error_h*60,0)} min</b></div>
      <div class="kv"><span>Attribution</span><b style="color:${v.attribution_correct?'var(--good)':'var(--critical)'}">${v.attribution_correct?'correct':'incorrect'}</b></div>
    </div>`:`
    <h2>Validation</h2>
    <div class="card"><div style="font-size:11.5px;color:var(--muted);line-height:1.55">
      Real satellite input — no laboratory ground truth to compare against.
      Confidence rests on the reported per-stage uncertainty above.
    </div></div>`}
    <p style="margin:8px 0 0;font-size:10.5px;color:var(--muted);line-height:1.5">
      Rankings are investigative leads. Enforcement action under MARPOL requires
      corroboration (oil fingerprinting, port state inspection).
    </p>
  </div>`));

  // Suspects
  const T2=document.getElementById('tab-suspects'); T2.innerHTML='';
  T2.append(el(`<div class="legend">
    <span><i style="background:#3987e5"></i>AIS</span>
    <span><i style="background:#d95926"></i>slick</span>
    <span><i style="background:#199e70"></i>inverted source</span>
    <span><i style="background:#d03b3b"></i>prime suspect</span>
    <span><i style="background:#898781"></i>AIS dark</span></div>`));
  rep.suspects.slice(0,6).forEach((s,i)=>{
    const k=risk(s.score);
    T2.append(el(`<div class="card suspect ${i===0?'active':''}">
      <div class="srow"><span><span class="nm">${s.name}</span><span class="mm"> · MMSI ${s.mmsi}</span></span>
        <span class="score">${s.score.toFixed(2)}</span></div>
      <div class="srow" style="margin-top:4px"><span class="mm">${s.type_name} · ${fmt(s.length,0)} m</span>
        <span class="badge" style="color:${k.c}">${k.label}</span></div>
      ${bars(s.terms)}
      <ul class="ev">${s.evidence.map(e=>`<li>${e}</li>`).join('')}</ul></div>`));
  });
  T2.append(el(`<details><summary>Evidence table (accessible view)</summary>
    <table><thead><tr><th>Vessel</th>${TERMS.map(t=>`<th>${t[1]}</th>`).join('')}<th>Score</th></tr></thead>
    <tbody>${rep.suspects.slice(0,6).map(s=>`<tr><td>${s.name}</td>`+
      TERMS.map(t=>`<td>${(s.terms[t[0]]??0).toFixed(2)}</td>`).join('')+
      `<td>${s.score.toFixed(2)}</td></tr>`).join('')}</tbody></table></details>`));

  // Alerts
  const T3=document.getElementById('tab-alerts'); T3.innerHTML='';
  (o.alerts||[]).forEach(a=>{
    T3.append(el(`<div class="alert al-${a.severity}">
      <div class="t"><span style="color:currentColor">■</span> ${a.severity} · ${a.kind}</div>
      <div style="font-weight:600;margin-top:2px">${a.title}</div>
      <div class="m">${a.message}</div></div>`));
  });

  // Patrol
  const T4=document.getElementById('tab-patrol'); T4.innerHTML='';
  T4.append(el(`<p style="font-size:10.5px;color:var(--muted);margin:0 0 8px;line-height:1.55">
    Decision-support tasking. Not tactical guidance — dispatch, boarding and
    use of force remain under human authority.</p>`));
  (o.patrol||[]).forEach(t=>{
    T4.append(el(`<div class="patrol">
      <div class="hd"><span class="p${t.priority[1]}">● ${t.priority} · ${t.action}</span>
        <span>${t.asset_class}</span></div>
      <div class="tg">${t.target}</div>
      <div class="rs">${t.reason}</div>
      <div style="font-size:10.5px;color:var(--muted);margin-top:4px">
        ${fmt(t.lat,3)}, ${fmt(t.lon,3)} · r=${fmt(t.radius_km,0)} km · ${t.eta_hint}
      </div></div>`));
  });

  // Timeline
  const T4b=document.getElementById('tab-timeline'); T4b.innerHTML='';
  fetch('/api/incidents/'+o.incident_id+'/timeline').then(r=>r.json()).then(tl=>{
    T4b.append(el('<h2>Incident timeline</h2>'));
    const clist=el('<div class="card" style="padding:0"></div>');
    (tl.events||[]).forEach(ev=>{
      const th=ev.t_rel_h;
      const cls={acquisition:'good',release_start:'serious',release_end:'serious',
        ais_gap_open:'critical',ais_gap_close:'warning',classified:'info',
        attributed:'brand'}[ev.kind]||'muted';
      const colours={good:'var(--good)',serious:'var(--serious)',critical:'var(--critical)',
        warning:'var(--warning)',info:'var(--info)',brand:'var(--brand)',muted:'var(--muted)'};
      clist.append(el(`<div style="padding:8px 12px;border-bottom:1px solid var(--grid);display:flex;gap:10px;align-items:baseline">
        <span style="min-width:52px;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted)">${th<0?fmt(th,1):'+'+fmt(th,1)}h</span>
        <span style="width:8px;height:8px;border-radius:50%;background:${colours[cls]};display:inline-block;flex:none;margin-top:5px"></span>
        <span style="font-size:11.5px;color:var(--ink);flex:1;line-height:1.5">${ev.label}</span></div>`));
    });
    T4b.append(clist);
    T4b.append(el('<p style="font-size:10.5px;color:var(--muted);margin:6px 0 0;line-height:1.5">Times relative to SAR acquisition. Negative = before, positive = after.</p>'));
  });

  // Evidence
  const T5=document.getElementById('tab-evidence'); T5.innerHTML='';
  T5.append(el(`<h2>Evidence package</h2>`));
  T5.append(el(`<div class="card">
    <p style="font-size:11.5px;color:var(--ink-2);margin:0 0 8px;line-height:1.55">
      A traceable investigation dossier for ${o.incident_id}. Every claim is
      linked to its model version and dataset via the provenance chain.
    </p>
    <div id="downloadBtns">
      <a href="/incidents/${o.incident_id}/${o.evidence_pack.json}" download>JSON</a>
      <a href="/incidents/${o.incident_id}/${o.evidence_pack.geojson}" download>GeoJSON</a>
      <a href="/incidents/${o.incident_id}/${o.evidence_pack.csv}" download>Suspects CSV</a>
      <a href="/api/incidents/${o.incident_id}/evidence.pdf" download>PDF report</a>
      <a href="#" id="notifyBtn" style="border-color:var(--warning);color:var(--warning)">Notify channels</a>
    </div></div>`));
  setTimeout(()=>{const nb=document.getElementById('notifyBtn'); if(!nb)return;
    nb.addEventListener('click',async ev=>{ev.preventDefault();
      const r=await (await fetch('/api/incidents/'+o.incident_id+'/notify',{method:'POST'})).json();
      alert('Dispatch results:\n\n'+r.dispatched.map(x=>x.channels.map(c=>c[0]+': '+c[1]).join(' · ')).join('\n')||'no channels configured');
    });},50);
  T5.append(el(`<h2>Provenance chain</h2>`));
  const prov=el(`<div class="card"></div>`);
  o.provenance.chain.forEach((line,i)=>{
    prov.append(el(`<div class="kv"><span>Step ${i+1}</span><b style="font-weight:400;font-size:10.5px;color:var(--ink-2);text-align:left">${line}</b></div>`));
  });
  T5.append(prov);
  T5.append(el(`<h2>Model versions</h2>`));
  const mv=el(`<div class="card"></div>`);
  Object.entries(o.provenance.model_versions).forEach(([k,v])=>{
    mv.append(el(`<div class="kv"><span>${k}</span><b style="font-weight:400;font-size:10.5px">${v}</b></div>`));
  });
  T5.append(mv);
}

/* -------------------------------------------- streaming pipeline run --- */
function setStage(idx, text){
  document.querySelector('#stagebar span').style.width = ((idx/STAGES.length)*100)+'%';
  document.getElementById('stagetext').textContent = text;
}
async function runOne(){
  const btn=document.getElementById('runOne');
  btn.classList.add('busy'); btn.textContent='running…';
  const slug=document.getElementById('scenario').value;
  const es = new EventSource(`/api/analysis/run/stream?scenario=${encodeURIComponent(slug)}`);
  const stageNames={
    ingest:'Reading SAR scene + metocean',
    detect:'Speckle → detrend → threshold',
    characterize:'Thickness · volume · age',
    drift:'Advecting 4000 particles',
    invert:'Source-term inversion',
    attribute:'Reconstructing AIS · scoring'};
  STAGES.forEach(n=>{
    es.addEventListener(n, ev=>{const i=STAGES.indexOf(n);setStage(i,stageNames[n]+' …');});
  });
  es.addEventListener('incident', async ev=>{
    es.close();
    setStage(STAGES.length,'complete');
    btn.classList.remove('busy'); btn.textContent='▶ Run pipeline';
    await loadIncidents();
    const inc=JSON.parse(ev.data);
    openIncident(inc.incident_id);
    setTimeout(()=>setStage(0,'idle'),1500);
  });
  es.addEventListener('error', ()=>{es.close(); btn.classList.remove('busy');
    btn.textContent='▶ Run pipeline'; setStage(0,'stream lost');});
}
async function runAll(){
  const btn=document.getElementById('runAll');
  btn.disabled=true; btn.textContent='running every scenario…';
  const es = new EventSource('/api/replay/start');
  const stageNames={ingest:'reading SAR',detect:'detecting',characterize:'characterising',
    drift:'drifting',invert:'inverting',attribute:'attributing'};
  let curName='';
  es.addEventListener('scenario_start', ev=>{
    const d=JSON.parse(ev.data);
    curName=d.name; setStage(0, `[${d.index+1}/${d.total}] ${d.name}`);
  });
  STAGES.forEach(n=>{
    es.addEventListener(n, ev=>{const i=STAGES.indexOf(n);setStage(i,`${curName}: ${stageNames[n]}…`);});
  });
  es.addEventListener('scenario_done', async ev=>{await loadIncidents();});
  es.addEventListener('replay_done', ev=>{
    es.close(); btn.disabled=false; btn.textContent='▶▶ Run every scenario';
    setStage(STAGES.length,'replay complete'); setTimeout(()=>setStage(0,'idle'),2000);
  });
  es.addEventListener('error', ()=>{es.close(); btn.disabled=false;
    btn.textContent='▶▶ Run every scenario';});
}

/* --------------------------------------------------------------- tools -- */
let vectorsOn=false;
async function refreshVectors(){
  if(!vectorsOn||!R) return;
  const b=R.scene.bounds;
  const q=`south=${b[0][0]}&west=${b[0][1]}&north=${b[1][0]}&east=${b[1][1]}&t_rel_h=${T}&n=20`;
  const gj=await (await fetch('/api/environment/vectors?'+q)).json();
  if(map.getSource('vec')) map.getSource('vec').setData(gj);
}
function toggleVectors(on){
  vectorsOn=on;
  ['vec-current','vec-wind'].forEach(id=>
    map.setLayoutProperty(id,'visibility', on?'visible':'none'));
  if(on) refreshVectors();
}
function wireTools(){
  // Vector-field toggle in the map tools rack.
  const btn=el('<button id="btnVec" title="Currents + wind vectors from the ocean model">Vectors</button>');
  document.getElementById('maptools').insertBefore(btn, document.getElementById('btn3d'));
  btn.addEventListener('click',()=>{toggleVectors(!vectorsOn); btn.classList.toggle('on', vectorsOn);});
  document.getElementById('runOne').addEventListener('click',runOne);
  document.getElementById('runAll').addEventListener('click',runAll);
  document.getElementById('basemap').addEventListener('change', async e=>{
    const centre=map.getCenter(),zoom=map.getZoom(),pitch=map.getPitch(),bearing=map.getBearing();
    map.setStyle(styleFor(e.target.value));
    await new Promise(res=>map.once('styledata',res));
    await ensureBaseLayers();
    await loadJurisdictions();
    if(R) installIncidentLayers(R);
    map.jumpTo({center:centre,zoom:zoom,pitch:pitch,bearing:bearing});
    setTime(T);
  });
  const b3=document.getElementById('btn3d');
  b3.addEventListener('click',()=>{
    const on=map.getPitch()<15;
    map.easeTo({pitch:on?55:0,bearing:on?-20:0,duration:900});
    b3.classList.toggle('on',on);
  });
  document.getElementById('btnFrame').addEventListener('click',frameSlick);
}
boot();
</script>
